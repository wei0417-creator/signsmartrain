const ABSENT_REASONS = ["身體不適/就醫", "家屬帶回/外出", "住院中", "住民無意願/情緒因素", "其他(請手動輸入)"];
let currentUser = null;
let compressedPhotos = [];

// 登入流程（自動將帳號轉小寫，避免手機首字大寫導致失敗）
async function login() {
  const username = document.getElementById('username').value.trim().toLowerCase();
  const password = document.getElementById('password').value.trim();
  if (!username || !password) return alert('請輸入帳號與密碼');

  showLoading('驗證帳號中...');
  try {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'login', username, password })
    });
    const data = await res.json();
    hideLoading();

    if (data.status === 'success') {
      currentUser = data.user;
      initDashboard();
    } else {
      alert(data.message);
    }
  } catch (err) {
    hideLoading();
    alert('連線失敗，請確認 GAS 部署權限是否設為「所有人」：' + err);
  }
}

function logout() {
  currentUser = null;
  compressedPhotos = [];
  document.getElementById('mainSection').classList.add('hidden');
  document.getElementById('userBadge').classList.add('hidden');
  document.getElementById('loginSection').classList.remove('hidden');
}

// 初始化主畫面
function initDashboard() {
  document.getElementById('loginSection').classList.add('hidden');
  document.getElementById('mainSection').classList.remove('hidden');
  document.getElementById('userBadge').classList.remove('hidden');
  document.getElementById('staffNameDisplay').textContent = currentUser.name;

  const select = document.getElementById('institutionSelect');
  select.innerHTML = '';
  const allowed = currentUser.allowedInsts;
  const filteredInsts = (allowed === 'ALL')
    ? INSTITUTIONS
    : INSTITUTIONS.filter(inst => allowed.split(',').map(s => s.trim()).includes(String(inst.id)));

  filteredInsts.forEach(inst => {
    const opt = document.createElement('option');
    opt.value = inst.id;
    opt.textContent = `${inst.id}. ${inst.name}（${inst.residents.length}床）`;
    select.appendChild(opt);
  });

  const todayStr = new Date().toISOString().split('T')[0];
  const dateInput = document.getElementById('attendanceDate');
  dateInput.min = '2026-11-23';
  dateInput.max = '2027-01-15';
  dateInput.value = (todayStr >= '2026-11-23' && todayStr <= '2027-01-15') ? todayStr : '2026-11-23';
  
  validateDate();
  onInstitutionChange();
}

// 日期檢核：11/23 ~ 1/15 且必須為週一至週五
function validateDate() {
  const dateStr = document.getElementById('attendanceDate').value;
  const warningEl = document.getElementById('dateWarning');
  const weekdayEl = document.getElementById('weekdayDisplay');
  const submitBtn = document.getElementById('submitBtn');

  if (!dateStr) return false;
  const d = new Date(dateStr + 'T00:00:00');
  const day = d.getDay();
  const weekNames = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'];
  weekdayEl.textContent = `${dateStr} (${weekNames[day]})`;

  if (dateStr < '2026-11-23' || dateStr > '2027-01-15') {
    warningEl.textContent = '⚠️ 日期不在計畫執行期間（11/23 ～ 1/15）內！';
    warningEl.classList.remove('hidden');
    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
    return false;
  }
  if (day === 0 || day === 6) {
    warningEl.textContent = '⚠️ 假日無需點名，請選擇週一至週五的日期！';
    warningEl.classList.remove('hidden');
    submitBtn.disabled = true;
    submitBtn.classList.add('opacity-50', 'cursor-not-allowed');
    return false;
  }

  warningEl.classList.add('hidden');
  submitBtn.disabled = false;
  submitBtn.classList.remove('opacity-50', 'cursor-not-allowed');
  return true;
}

// 切換機構時渲染住民名單
function onInstitutionChange() {
  const instId = Number(document.getElementById('institutionSelect').value);
  const inst = INSTITUTIONS.find(i => i.id === instId);
  if (!inst) return;

  document.getElementById('contactInfo').textContent = `機構主責窗口：${inst.contact}`;
  document.getElementById('residentCount').textContent = inst.residents.length;

  const listEl = document.getElementById('residentList');
  listEl.innerHTML = '';

  inst.residents.forEach((name, index) => {
    const card = document.createElement('div');
    card.className = 'p-3.5 rounded-lg border border-slate-200 bg-slate-50/70 space-y-2.5';
    card.innerHTML = `
      <div class="flex flex-wrap items-center justify-between gap-2">
        <div class="font-bold text-slate-800 text-base">
          <span class="inline-block w-6 text-slate-400 text-sm">${index + 1}.</span>${name}
        </div>
        <div class="flex gap-2">
          <label class="cursor-pointer">
            <input type="radio" name="status_${index}" value="出席" checked onchange="toggleReason(${index}, false)" class="peer hidden">
            <span class="px-3.5 py-1.5 rounded-md text-sm font-medium border border-slate-300 bg-white text-slate-600 peer-checked:bg-emerald-600 peer-checked:text-white peer-checked:border-emerald-600 transition">
              ✓ 出席
            </span>
          </label>
          <label class="cursor-pointer">
            <input type="radio" name="status_${index}" value="未出席" onchange="toggleReason(${index}, true)" class="peer hidden">
            <span class="px-3.5 py-1.5 rounded-md text-sm font-medium border border-slate-300 bg-white text-slate-600 peer-checked:bg-rose-600 peer-checked:text-white peer-checked:border-rose-600 transition">
              ✕ 未出席
            </span>
          </label>
        </div>
      </div>
      
      <div id="reasonBox_${index}" class="hidden pt-1 border-t border-slate-200 space-y-2">
        <div class="flex flex-col sm:flex-row gap-2">
          <select id="reasonSelect_${index}" onchange="onReasonSelect(${index})" class="text-sm border border-slate-300 rounded px-2.5 py-1.5 bg-white">
            <option value="">-- 請選擇未出席原因 --</option>
            ${ABSENT_REASONS.map(r => `<option value="${r}">${r}</option>`).join('')}
          </select>
          <input type="text" id="reasonText_${index}" placeholder="補充說明原因（未出席必填）" class="flex-1 text-sm border border-slate-300 rounded px-2.5 py-1.5 bg-white">
        </div>
      </div>
    `;
    listEl.appendChild(card);
  });

  loadHistory();
}

function toggleReason(index, isAbsent) {
  const box = document.getElementById(`reasonBox_${index}`);
  if (isAbsent) {
    box.classList.remove('hidden');
  } else {
    box.classList.add('hidden');
    document.getElementById(`reasonSelect_${index}`).value = '';
    document.getElementById(`reasonText_${index}`).value = '';
  }
}

function onReasonSelect(index) {
  const sel = document.getElementById(`reasonSelect_${index}`).value;
  const txt = document.getElementById(`reasonText_${index}`);
  if (sel && !sel.includes('其他')) {
    txt.value = sel;
  } else {
    txt.value = '';
    txt.focus();
  }
}

function markAllPresent() {
  const instId = Number(document.getElementById('institutionSelect').value);
  const inst = INSTITUTIONS.find(i => i.id === instId);
  inst.residents.forEach((_, idx) => {
    const radio = document.querySelector(`input[name="status_${idx}"][value="出席"]`);
    if (radio) {
      radio.checked = true;
      toggleReason(idx, false);
    }
  });
}

async function handlePhotoSelect(event) {
  const files = Array.from(event.target.files);
  if (compressedPhotos.length + files.length > 3) {
    alert('最多只能上傳 3 張現場照片！');
    event.target.value = '';
    return;
  }

  showLoading('壓縮處理照片中...');
  for (const file of files) {
    const base64 = await compressImage(file, 1280, 0.75);
    compressedPhotos.push({ name: file.name, base64 });
  }
  hideLoading();
  event.target.value = '';
  renderPhotoPreviews();
}

function compressImage(file, maxWidth, quality) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function renderPhotoPreviews() {
  const grid = document.getElementById('photoPreviewGrid');
  grid.innerHTML = '';
  compressedPhotos.forEach((photo, idx) => {
    const div = document.createElement('div');
    div.className = 'relative rounded-lg overflow-hidden border border-slate-300 aspect-square bg-slate-100';
    div.innerHTML = `
      <img src="${photo.base64}" class="w-full h-full object-cover">
      <button type="button" onclick="removePhoto(${idx})" class="absolute top-1 right-1 bg-rose-600 text-white rounded-full w-6 h-6 text-xs font-bold shadow">✕</button>
      <span class="absolute bottom-1 left-1 bg-black/60 text-white text-[10px] px-1.5 py-0.5 rounded">照片 ${idx + 1}</span>
    `;
    grid.appendChild(div);
  });
}

function removePhoto(idx) {
  compressedPhotos.splice(idx, 1);
  renderPhotoPreviews();
}

async function submitForm() {
  if (!validateDate()) return;

  const instId = Number(document.getElementById('institutionSelect').value);
  const inst = INSTITUTIONS.find(i => i.id === instId);
  const dateStr = document.getElementById('attendanceDate').value;
  const d = new Date(dateStr + 'T00:00:00');
  const weekday = ['週日', '週一', '週二', '週三', '週四', '週五', '週六'][d.getDay()];

  const records = [];
  for (let i = 0; i < inst.residents.length; i++) {
    const status = document.querySelector(`input[name="status_${i}"]:checked`).value;
    const reasonText = document.getElementById(`reasonText_${i}`).value.trim();
    const reasonSel = document.getElementById(`reasonSelect_${i}`).value;
    const finalReason = reasonText || reasonSel;

    if (status === '未出席' && !finalReason) {
      alert(`請註明住民「${inst.residents[i]}」的未出席原因！`);
      return;
    }
    records.push({
      residentName: inst.residents[i],
      status,
      reason: finalReason
    });
  }

  if (compressedPhotos.length < 1 || compressedPhotos.length > 3) {
    alert('請上傳 1 至 3 張現場照片！');
    return;
  }

  if (!confirm(`確認提交【${inst.name}】${dateStr} 的點名紀錄嗎？`)) return;

  showLoading('正在上傳照片與點名資料至雲端，請勿關閉視窗...');
  try {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({
        action: 'submitAttendance',
        instId: inst.id,
        instName: inst.name,
        date: dateStr,
        weekday,
        staffName: currentUser.name,
        records,
        photos: compressedPhotos
      })
    });
    const data = await res.json();
    hideLoading();

    if (data.status === 'success') {
      alert('✅ ' + data.message);
      compressedPhotos = [];
      renderPhotoPreviews();
      loadHistory();
    } else {
      alert('❌ 提交失敗：' + data.message);
    }
  } catch (err) {
    hideLoading();
    alert('網路連線異常，請重試：' + err);
  }
}

async function loadHistory() {
  const instId = document.getElementById('institutionSelect').value;
  const historyEl = document.getElementById('historyList');
  historyEl.innerHTML = '讀取紀錄中...';

  try {
    const res = await fetch(GAS_API_URL, {
      method: 'POST',
      body: JSON.stringify({ action: 'getHistory', instId })
    });
    const data = await res.json();
    if (data.status === 'success' && data.history.length > 0) {
      historyEl.innerHTML = data.history.map(h => `
        <div class="flex justify-between items-center p-2.5 bg-slate-50 rounded border border-slate-200">
          <div>
            <span class="font-bold text-slate-700">${h.date} (${h.weekday})</span>
            <span class="text-xs text-slate-500 ml-2">填報：${h.staff}</span>
            <div class="text-xs mt-0.5">
              <span class="text-emerald-700 font-medium">出席 ${h.attendCount} 人</span> / 
              <span class="text-rose-600 font-medium">未出席 ${h.absentCount} 人</span>
            </div>
          </div>
          ${h.photoUrl ? `<a href="${h.photoUrl}" target="_blank" class="text-xs bg-white border border-slate-300 px-2 py-1 rounded text-teal-700 hover:bg-teal-50">查看照片</a>` : ''}
        </div>
      `).join('');
    } else {
      historyEl.innerHTML = '<p class="text-xs text-slate-400">尚無點名紀錄</p>';
    }
  } catch (e) {
    historyEl.innerHTML = '<p class="text-xs text-rose-400">無法讀取紀錄</p>';
  }
}

function showLoading(text) {
  document.getElementById('loadingText').textContent = text;
  document.getElementById('loadingOverlay').classList.remove('hidden');
}
function hideLoading() {
  document.getElementById('loadingOverlay').classList.add('hidden');
}
</script>
